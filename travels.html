  <section class="passport" aria-labelledby="passport-title">
    <div class="passport__book">
      <header class="passport__head">
        <p class="eyebrow">stamped so far</p>

      <ol class="stamps" data-stamps></ol>
      <h3 class="corners__title">The far corners</h3>
