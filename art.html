  <!-- The gallery: a wall of framed pieces, hung on picture rails that run

  <section class="gallery" aria-labelledby="gallery-title">
    <p class="gallery__hint" data-plaque>

    <ol class="hang" data-hang aria-label="Artworks"></ol>
    <noscript><p class="gallery__noscript">The gallery needs JavaScript to hang the pictures. Turn it on to see my art.</p></noscript>
  </section>

<!-- full screen: one piece at a time -->
<dialog class="viewer" aria-labelledby="viewer-title" data-viewer>
  <div class="viewer__veil" data-veil></div>
  <figure class="viewer__figure">
    <div class="viewer__stage" data-stage>
      <div class="viewer__art" data-art></div>
    </div>
    <figcaption class="viewer__caption" data-caption>
      <p class="viewer__count" data-count></p>
      <h2 id="viewer-title" data-title></h2>
      <p class="viewer__meta" id="viewer-meta" data-meta></p>
      <p class="viewer__note" data-note></p>
      <p class="viewer__hint" data-hint>click the picture to look closer</p>
    </figcaption>
  </figure>
  <button type="button" class="viewer__btn viewer__go viewer__go--prev" data-go="-1" aria-label="Previous piece">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5 L8 12 L15 19"/></svg>
  </button>
  <button type="button" class="viewer__btn viewer__go viewer__go--next" data-go="1" aria-label="Next piece">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5 L16 12 L9 19"/></svg>
  </button>
  <div class="viewer__tools">
    <button type="button" class="viewer__btn" data-fullscreen aria-label="Fill the whole screen" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9 V4 H9 M15 4 H20 V9 M20 15 V20 H15 M9 20 H4 V15"/></svg>
    </button>
    <button type="button" class="viewer__btn" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
    </button>
  </div>
  <p class="visually-hidden" aria-live="polite" data-live></p>
</dialog>
