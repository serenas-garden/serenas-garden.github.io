    <div class="page-art" aria-hidden="true">
      <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="46" cy="44" r="30" style="fill:#9cc4e2"/>

      </svg>
    </div>
  </header>

  <!-- The game (assets/travel-game.js): a boarding pass says where to find,
       the globe (globe.js in its game mode: no borders, no labels) takes the
       guess, and the postcard on the right explains, scores and sums up. -->
  <section class="tg-board" aria-label="The game">
    <div class="tg-stage">
      <div class="tg-pass-wrap">
        <div class="tg-pass">
          <div class="tg-pass__main">
            <p class="tg-pass__label"><span>garden air</span> <span data-round>boarding pass</span></p>
            <p class="tg-pass__place" data-place>Where&#x27;s Serena?</p>
            <p class="tg-pass__where" data-where>five places &middot; 1,000 points</p>
          </div>
          <div class="tg-pass__stub">
            <ol class="tg-track" data-track aria-label="The five rounds"></ol>
          </div>
        </div>
      </div>

      <figure class="desk-globe tg-globe">
        <div class="desk-globe__frame">
          <svg class="desk-globe__stand" viewBox="0 0 100 118" aria-hidden="true" focusable="false">
            <ellipse class="stand__shadow" cx="50" cy="113.8" rx="26" ry="2.6"/>
            <path class="ink f-gold" d="M48.6 94 H51.4 V100 H48.6Z"/>
            <path class="ink f-wood" d="M44.6 99.4 C44.6 101.4 47.6 102.2 47.6 104.2 C47.6 106.2 43.6 106.6 43.6 108.4 H56.4 C56.4 106.6 52.4 106.2 52.4 104.2 C52.4 102.2 55.4 101.4 55.4 99.4 Z"/>
            <ellipse class="ink f-wood-dark" cx="50" cy="109.8" rx="20" ry="3.4"/>
            <ellipse class="stand__top" cx="50" cy="108.9" rx="17.4" ry="2.2"/>
            <path class="ink f-gold" fill-rule="evenodd" d="M5.4 50 a44.6 44.6 0 1 0 89.2 0 a44.6 44.6 0 1 0 -89.2 0 Z M7.8 50 a42.2 42.2 0 1 0 84.4 0 a42.2 42.2 0 1 0 -84.4 0 Z"/>
            <path class="stand__ticks" d="M92.40 50.00 L94.40 50.00 M91.95 57.40 L93.53 57.68 M90.03 64.57 L91.53 65.12 M86.72 71.20 L88.45 72.20 M82.63 77.38 L83.86 78.41 M77.38 82.63 L78.41 83.86 M71.20 86.72 L72.20 88.45 M64.57 90.03 L65.12 91.53 M57.40 91.95 L57.68 93.53 M50.00 92.40 L50.00 94.40 M42.60 91.95 L42.32 93.53 M35.43 90.03 L34.88 91.53 M28.80 86.72 L27.80 88.45 M22.62 82.63 L21.59 83.86 M17.37 77.38 L16.14 78.41 M13.28 71.20 L11.55 72.20 M9.97 64.57 L8.47 65.12 M8.05 57.40 L6.47 57.68 M7.60 50.00 L5.60 50.00 M8.05 42.60 L6.47 42.32 M9.97 35.43 L8.47 34.88 M13.28 28.80 L11.55 27.80 M17.37 22.62 L16.14 21.59 M22.62 17.37 L21.59 16.14 M28.80 13.28 L27.80 11.55 M35.43 9.97 L34.88 8.47 M42.60 8.05 L42.32 6.47 M50.00 7.60 L50.00 5.60 M57.40 8.05 L57.68 6.47 M64.57 9.97 L65.12 8.47 M71.20 13.28 L72.20 11.55 M77.38 17.37 L78.41 16.14 M82.63 22.62 L83.86 21.59 M86.72 28.80 L88.45 27.80 M90.03 35.43 L91.53 34.88 M91.95 42.60 L93.53 42.32"/>
            <circle class="ink f-gold" cx="50" cy="4.6" r="1.8"/>
            <circle class="ink f-gold" cx="50" cy="95.4" r="1.8"/>
          </svg>
          <div class="globe" data-globe tabindex="0" role="application"
               aria-label="The globe, with no labels. Arrow keys turn it, plus and minus zoom, and Enter drops your pin in the middle."
               aria-describedby="tg-help"></div>
        </div>
      </figure>

      <p class="globe-help" id="tg-help" data-help>drag to spin &middot; pinch or scroll to zoom &middot; tap to drop your pin</p>
      <div class="globe-tools tg-tools" role="group" aria-label="Globe controls">
        <button type="button" class="globe-tools__round" data-act="out" aria-label="Zoom out">&minus;</button>
        <button type="button" class="globe-tools__round" data-act="in" aria-label="Zoom in">+</button>
        <button type="button" data-act="home">whole world</button>
        <button type="button" class="tg-main" data-main hidden>lock it in</button>
      </div>
      <noscript><p class="globe-help">The game needs JavaScript to spin the globe. Turn it on to play!</p></noscript>
    </div>

    <article class="postcard tg-card" data-card></article>
  </section>

  <p class="visually-hidden" aria-live="polite" data-live></p>
  <nav class="rooms" aria-label="Other rooms" data-rooms hidden></nav>
